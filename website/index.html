<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lynx 灵犀 — Free Gamepad Mapper, the reference tool Compatible</title>
<meta name="description" content="Lynx (灵犀) is a free open-source gamepad remapper for Windows. Interactive 3D controller, the reference tool-compatible profiles, virtual gamepads, macros, radial menu.">
<style>
:root{
  --bg:#0b0f16;--bg2:#111827;--panel:#141b26;--panel2:#1a2332;
  --line:#243044;--text:#e8edf4;--muted:#8f9cb0;--accent:#6fb6ff;--accent2:#3fa17f;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.65 "Segoe UI",system-ui,-apple-system,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,kbd{background:#0d1420;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:14px/1.6 Consolas,monospace;color:#a8d5ff}

/* nav */
nav{position:sticky;top:0;z-index:50;background:rgba(11,15,22,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:18px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--text)}
.logo .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2))}
nav .spacer{flex:1}
.langbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px}
.langbtn:hover{border-color:var(--accent)}
.gh{display:flex;align-items:center;gap:7px}

/* hero */
header{padding:72px 0 48px;text-align:center;background:
  radial-gradient(1000px 500px at 50% -10%,#16233a 0%,transparent 70%)}
header .tag{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 16px;font-size:13.5px;color:var(--muted);margin-bottom:22px}
header .brandline{font-size:60px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#E8F2FF,#8FB8E8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
header h1{font-size:38px;margin-top:26px;line-height:1.15;letter-spacing:-.5px}
header h1 b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p.sub{max-width:720px;margin:18px auto 0;color:var(--muted);font-size:18px}
.dl{display:flex;gap:14px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;border-radius:11px;padding:13px 26px;font-size:16px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,#2f7fd6,#1f5ea8);color:#fff}
.btn.primary:hover{filter:brightness(1.12);text-decoration:none}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent);text-decoration:none}
.meta{margin-top:18px;color:var(--muted);font-size:14px}
.meta .sep{margin:0 10px;opacity:.5}

/* sections */
section{padding:58px 0;border-top:1px solid var(--line)}
h2{font-size:30px;margin-bottom:8px;letter-spacing:-.3px}
p.lead{color:var(--muted);margin-bottom:34px;max-width:760px}

/* gallery */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.shot img{width:100%;display:block}
.shot .cap{padding:12px 15px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.shot.wide{grid-column:span 2}
@media(max-width:720px){.shot.wide{grid-column:span 1}}

/* features */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.feat .ic{font-size:26px;margin-bottom:10px}
.feat h3{font-size:17.5px;margin-bottom:7px}
.feat p{color:var(--muted);font-size:14.5px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-13px;left:18px;background:var(--accent);color:#06121f;font-weight:800;border-radius:8px;padding:1px 10px}
.step h3{font-size:16.5px;margin:6px 0 7px}
.step p{color:var(--muted);font-size:14.5px}

footer{border-top:1px solid var(--line);padding:36px 0 44px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer .spacer{flex:1}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 11px;font-size:13px}
</style>
</head>
<body>

    <span class="spacer"></span>

    <a class="gh" href="https://github.com/bbsx123321/lynx" target="_blank" rel="noopener">

      GitHub</a>
  </div>
</nav>

<header>
  <div class="wrap">

const RELEASE_URL = "https://github.com/" + REPO + "/releases/latest/download/Lynx.exe";

let lang = "en";
function apply() {
  const dict = i18n[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = dict[el.dataset.i18n] ?? el.textContent; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = dict[el.dataset.i18nHtml] ?? el.innerHTML; });
  document.getElementById("langbtn").textContent = lang === "zh" ? "English" : "中文";
  document.title = lang === "zh" ? "灵犀 Lynx — 免费开源手柄映射器，兼容 the reference tool" : "Lynx 灵犀 — Free Gamepad Mapper, the reference tool Compatible";
}
function toggleLang() { lang = lang === "zh" ? "en" : "zh"; apply(); save(); }
function save() { try { localStorage.setItem("padshift-lang", lang); } catch (e) {} }
function load() { try { const v = localStorage.getItem("padshift-lang"); if (v === "zh" || v === "en") lang = v; } catch (e) {} }
function dl(el, kind) {
  const url = kind === "proxy" ? PROXY_PREFIX + RELEASE_URL : RELEASE_URL;
  window.open(url, "_blank", "noopener");
  return false;
}
load(); apply();
</script>
